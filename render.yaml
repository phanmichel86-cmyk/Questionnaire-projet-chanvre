services:
  - type: web
    name: coach-sportif-ia
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: coach-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

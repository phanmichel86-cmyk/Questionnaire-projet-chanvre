# Fly.io configuration — adapt `app` to your own app name after `fly launch`
app = "coach-sportif-ia"
primary_region = "cdg"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Persistent storage for the SQLite database
[mounts]
  source = "coach_data"
  destination = "/app/data"

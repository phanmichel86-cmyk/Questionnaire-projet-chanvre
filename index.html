<title>Panda Maman</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap&subset=latin,latin-ext,vietnamese">

<style>
/* ============ TOKENS ============ */
:root{
  --sakura-deep:#EC5A83;
  --sakura:#F58AA8;
  --sakura-soft:#FBD4DE;
  --sakura-mist:#FDEAEF;
  --bamboo:#5FAE84;
  --bamboo-soft:#CDE9D7;
  --honey:#F4B95F;
  --sky:#7FB4DB;

  --ink:#39323C;         /* panda soft-black */
  --text:#5F5560;
  --text-soft:#8C8189;
  --line:#F1E2E6;

  --ground:#FFF7F4;      /* warm sakura off-white */
  --card:#FFFFFF;
  --card-2:#FEF1F0;
  --shadow:22px 30px 60px -34px rgba(158,86,110,.55);
  --shadow-sm:0 10px 24px -16px rgba(158,86,110,.5);

  --ok:#4FA97F; --ok-bg:#E4F4EB;
  --warn:#DE9A2E; --warn-bg:#FBEED5;
  --no:#E06277;  --no-bg:#FBE0E5;

  --r:22px; --r-lg:30px;
  --shell:468px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sakura-deep:#F98AAB; --sakura:#F58AA8; --sakura-soft:#4A3742; --sakura-mist:#352A34;
    --bamboo:#79C79B; --bamboo-soft:#2E4038;
    --ink:#F4EAF0; --text:#C9BCC6; --text-soft:#9C8E9A; --line:#3A303C;
    --ground:#211A26; --card:#2C2333; --card-2:#332839;
    --shadow:22px 30px 60px -30px rgba(0,0,0,.6);
    --shadow-sm:0 10px 24px -16px rgba(0,0,0,.55);
    --ok:#6FC79B; --ok-bg:#27392F;
    --warn:#E7B45C; --warn-bg:#3D3320;
    --no:#F0899C; --no-bg:#40262E;
  }
}
:root[data-theme="dark"]{
  --sakura-deep:#F98AAB; --sakura:#F58AA8; --sakura-soft:#4A3742; --sakura-mist:#352A34;
  --bamboo:#79C79B; --bamboo-soft:#2E4038;
  --ink:#F4EAF0; --text:#C9BCC6; --text-soft:#9C8E9A; --line:#3A303C;
  --ground:#211A26; --card:#2C2333; --card-2:#332839;
  --shadow:22px 30px 60px -30px rgba(0,0,0,.6);
  --shadow-sm:0 10px 24px -16px rgba(0,0,0,.55);
  --ok:#6FC79B; --ok-bg:#27392F;
  --warn:#E7B45C; --warn-bg:#3D3320;
  --no:#F0899C; --no-bg:#40262E;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Nunito",system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(120% 55% at 15% -8%, var(--sakura-mist), transparent 60%),
    radial-gradient(120% 55% at 90% 0%, var(--bamboo-soft) , transparent 55%),
    var(--ground);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
  line-height:1.55;
}
h1,h2,h3,.disp{font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);text-wrap:balance;letter-spacing:.1px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:3px solid var(--sakura);outline-offset:2px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ SHELL ============ */
.app{max-width:var(--shell);margin:0 auto;min-height:100vh;padding:0 16px calc(112px + env(safe-area-inset-bottom))}

.top{
  position:sticky;top:0;z-index:20;
  margin:0 -16px;padding:14px 18px 14px;
  background:linear-gradient(180deg,var(--ground) 72%,transparent);
  backdrop-filter:blur(8px);
}
.top-row{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand h1{font-size:1.32rem;margin:0;line-height:1;font-weight:800}
.brand small{display:block;font-family:"Nunito";font-weight:700;color:var(--sakura-deep);font-size:.66rem;letter-spacing:1.4px;text-transform:uppercase}
.mascot{width:46px;height:46px;flex:none;filter:drop-shadow(0 6px 10px rgba(158,86,110,.28))}

.lang{display:flex;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.lang button{font-weight:800;font-size:.78rem;padding:6px 11px;border-radius:999px;color:var(--text-soft);line-height:1}
.lang button[aria-pressed="true"]{background:var(--sakura-deep);color:#fff}
.theme-btn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow-sm);border:1px solid var(--line);font-size:1.05rem;display:grid;place-items:center;flex:none}

/* ============ CARDS ============ */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--line);padding:20px;margin:16px 0}
.card.tinted{background:linear-gradient(160deg,var(--card),var(--card-2))}
.eyebrow{font-size:.68rem;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--sakura-deep);display:flex;align-items:center;gap:7px;margin:0 0 10px}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--sakura);box-shadow:0 0 0 4px var(--sakura-soft)}

.pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.72rem;padding:5px 11px;border-radius:999px;line-height:1;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.no{background:var(--no-bg);color:var(--no)}
.pill.ghost{background:var(--sakura-mist);color:var(--sakura-deep)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;padding:13px 18px;border-radius:16px;background:var(--sakura-deep);color:#fff;box-shadow:0 12px 22px -12px var(--sakura-deep);width:100%;font-size:1rem;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--sakura-mist);color:var(--sakura-deep);box-shadow:none}

input,select{font-family:inherit;font-size:1rem;font-weight:700;color:var(--ink);width:100%;padding:13px 15px;border-radius:15px;border:2px solid var(--line);background:var(--card);appearance:none}
input:focus,select:focus{outline:none;border-color:var(--sakura)}
label.fld{font-weight:800;font-size:.82rem;color:var(--ink);display:block;margin:0 0 6px}
.field{margin:0 0 14px}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='%23EC5A83' stroke-width='3' stroke-linecap='round'><path d='M7 10l5 5 5-5'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:42px}

/* ============ HERO / SUIVI ============ */
.hero{position:relative;overflow:hidden;text-align:center;padding:24px 20px 22px;background:linear-gradient(165deg,#fff,var(--card-2))}
.hero .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5}
.week-big{font-family:"Baloo 2";font-weight:800;font-size:3.7rem;line-height:.9;color:var(--sakura-deep);margin:6px 0 2px}
.week-big span{font-size:1.1rem;color:var(--text-soft);font-weight:700}
.tri{font-weight:800;color:var(--bamboo);font-size:.95rem}
.countdown{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.cd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 14px;min-width:70px;box-shadow:var(--shadow-sm)}
.cd b{display:block;font-family:"Baloo 2";font-size:1.5rem;color:var(--ink);line-height:1}
.cd small{font-size:.64rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text-soft)}

.progress{height:16px;background:var(--sakura-mist);border-radius:999px;margin:18px 0 6px;overflow:hidden;position:relative;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--sakura),var(--sakura-deep));border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

.size-row{display:flex;align-items:center;gap:14px;margin-top:6px}
.size-emoji{width:64px;height:64px;flex:none;border-radius:20px;background:var(--bamboo-soft);display:grid;place-items:center;font-size:2rem}
.size-row .t{flex:1;min-width:0}
.size-row .t b{font-family:"Baloo 2";color:var(--ink);font-size:1.12rem;display:block}

.milestone{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.milestone:last-child{border-bottom:none}
.check{width:26px;height:26px;flex:none;border-radius:9px;border:2px solid var(--sakura-soft);background:var(--card);display:grid;place-items:center;margin-top:2px;transition:.15s;color:#fff;font-weight:900}
.milestone.done .check{background:var(--bamboo);border-color:var(--bamboo)}
.milestone.done .m-t{text-decoration:line-through;color:var(--text-soft)}
.m-t{font-weight:800;color:var(--ink);font-size:.98rem}
.m-d{font-size:.82rem;color:var(--text-soft)}
.m-wk{font-size:.66rem;font-weight:800;color:var(--sakura-deep);background:var(--sakura-mist);padding:2px 8px;border-radius:999px;white-space:nowrap;margin-top:3px;display:inline-block}

/* ============ LISTS / FOOD ============ */
.seg{display:flex;gap:7px;overflow-x:auto;padding:2px;margin:0 -2px 4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;font-weight:800;font-size:.82rem;padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text);box-shadow:var(--shadow-sm)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

.food{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.food:last-child{border-bottom:none}
.food .ic{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:var(--sakura-mist)}
.food .n{flex:1;min-width:0}
.food .n b{color:var(--ink);font-weight:800;display:block;font-size:.98rem}
.food .n span{font-size:.8rem;color:var(--text-soft);display:block;line-height:1.35}

/* ============ RECIPES ============ */
.rec{padding:0;overflow:hidden;cursor:pointer}
.rec .head{padding:16px 18px;display:flex;gap:12px;align-items:center}
.rec .thumb{width:56px;height:56px;flex:none;border-radius:18px;display:grid;place-items:center;font-size:2rem;background:var(--bamboo-soft)}
.rec h3{margin:0;font-size:1.08rem;line-height:1.05}
.rec .meta{font-size:.76rem;color:var(--text-soft);font-weight:700;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 16px}
.tag{font-size:.68rem;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--sakura-mist);color:var(--sakura-deep)}
.tag.g{background:var(--bamboo-soft);color:var(--bamboo)}
.rec .body{display:none;padding:0 18px 18px;border-top:1px dashed var(--line);margin-top:0}
.rec.open .body{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.rec .body h4{font-family:"Baloo 2";color:var(--sakura-deep);margin:16px 0 7px;font-size:.95rem}
.rec ul,.rec ol{margin:0;padding-left:20px}
.rec li{margin:5px 0;font-size:.92rem}
.why{background:var(--bamboo-soft);color:var(--bamboo);border-radius:14px;padding:11px 13px;font-size:.86rem;font-weight:700;margin-top:14px;display:flex;gap:8px}
.fav{margin-left:auto;font-size:1.5rem;line-height:1;background:none;flex:none;filter:grayscale(1);opacity:.5;transition:.15s}
.fav[aria-pressed="true"]{filter:none;opacity:1;transform:scale(1.1)}

/* exercise */
.ex .head .thumb{background:var(--sakura-soft)}
.safe{font-size:.8rem;font-weight:800;color:var(--warn);background:var(--warn-bg);border-radius:12px;padding:9px 12px;margin-top:12px;display:flex;gap:8px}

.intro{font-size:.9rem;color:var(--text)}
.disclaimer{font-size:.76rem;color:var(--text-soft);text-align:center;padding:6px 8px 2px;line-height:1.5}
.empty{text-align:center;color:var(--text-soft);font-weight:700;padding:30px 10px}
.sec-title{display:flex;align-items:center;gap:10px;margin:22px 4px 2px}
.sec-title h2{font-size:1.35rem;margin:0}

/* ============ TABBAR ============ */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30}
.tabbar-in{max-width:var(--shell);margin:0 auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:4px;
  background:var(--card);border-top:1px solid var(--line);border-radius:26px 26px 0 0;box-shadow:0 -18px 40px -28px rgba(158,86,110,.6)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;color:var(--text-soft);font-weight:800;font-size:.66rem}
.tab svg{width:25px;height:25px}
.tab[aria-pressed="true"]{color:var(--sakura-deep)}
.tab[aria-pressed="true"] .ib{background:var(--sakura-mist)}
.ib{width:52px;height:32px;border-radius:14px;display:grid;place-items:center;transition:.15s}

.view{animation:fade .35s}
.hidden{display:none!important}
.wk-nav{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:4px}
.wk-nav button{width:38px;height:38px;border-radius:50%;background:var(--sakura-mist);color:var(--sakura-deep);font-size:1.3rem;font-weight:900;display:grid;place-items:center}
.wk-nav b{font-family:"Baloo 2";min-width:120px;text-align:center;color:var(--ink)}
textarea{font-family:inherit;font-size:.95rem;font-weight:600;color:var(--ink);width:100%;padding:12px 14px;border-radius:15px;border:2px solid var(--line);background:var(--card);resize:vertical;min-height:70px}
textarea:focus{outline:none;border-color:var(--sakura)}
</style>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true">
          <ellipse cx="24" cy="30" rx="13" ry="14" fill="#39323C"/>
          <ellipse cx="76" cy="30" rx="13" ry="14" fill="#39323C"/>
          <circle cx="50" cy="56" r="34" fill="#fff" stroke="#39323C" stroke-width="2.5"/>
          <ellipse cx="35" cy="52" rx="10" ry="12" fill="#39323C"/>
          <ellipse cx="65" cy="52" rx="10" ry="12" fill="#39323C"/>
          <circle cx="35" cy="53" r="3.4" fill="#fff"/>
          <circle cx="65" cy="53" r="3.4" fill="#fff"/>
          <ellipse cx="50" cy="64" rx="4.6" ry="3.4" fill="#39323C"/>
          <path d="M44 71q6 5 12 0" stroke="#39323C" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <circle cx="24" cy="66" r="6" fill="#FBD4DE"/>
          <circle cx="76" cy="66" r="6" fill="#FBD4DE"/>
        </svg>
        <div>
          <h1>Panda Maman</h1>
          <small data-i="tagline">Suivi de grossesse</small>
        </div>
      </div>
      <button class="theme-btn" id="themeBtn" title="Thème" aria-label="Thème">🌙</button>
      <div class="lang" role="group" aria-label="Langue / Ngôn ngữ">
        <button data-lang="fr" aria-pressed="true">FR</button>
        <button data-lang="vi" aria-pressed="false">VI</button>
      </div>
    </div>
  </header>

  <main id="views"></main>

  <nav class="tabbar" aria-label="Navigation">
    <div class="tabbar-in" id="tabbar"></div>
  </nav>
</div>

<script>
/* ============================================================
   PANDA MAMAN — bilingual (FR / VI) pregnancy companion
   State persisted in localStorage. No network needed.
============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

const store={
  get(k,d){try{const v=localStorage.getItem('pm_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('pm_'+k,JSON.stringify(v));}catch(e){}}
};

let lang = store.get('lang','fr');
let tab  = 'suivi';
const T = o => (o && o[lang]!=null) ? o[lang] : (o?o.fr:'');

/* ---------- UI STRINGS ---------- */
const S = {
  tagline:{fr:'Suivi de grossesse',vi:'Theo dõi thai kỳ'},
  tabs:{
    suivi:{fr:'Suivi',vi:'Theo dõi'},
    food:{fr:'Gourmand',vi:'Ăn uống'},
    recipes:{fr:'Recettes',vi:'Công thức'},
    move:{fr:'Exercices',vi:'Vận động'}
  },
  setup_title:{fr:'Bienvenue, petite maman panda 🐼',vi:'Chào mẹ gấu trúc bé nhỏ 🐼'},
  setup_intro:{fr:'Indique ta date prévue d’accouchement (ou le 1ᵉʳ jour de tes dernières règles) pour suivre ta semaine, ton bébé et tes étapes.',
               vi:'Nhập ngày dự sinh (hoặc ngày đầu của kỳ kinh cuối) để theo dõi tuần thai, em bé và các cột mốc.'},
  by_dd:{fr:'Date prévue d’accouchement',vi:'Ngày dự sinh'},
  by_lmp:{fr:'1ᵉʳ jour des dernières règles',vi:'Ngày đầu kinh cuối'},
  mode_dd:{fr:'Je connais ma date de terme',vi:'Tôi biết ngày dự sinh'},
  mode_lmp:{fr:'Je connais mes dernières règles',vi:'Tôi biết ngày kinh cuối'},
  save:{fr:'C’est parti !',vi:'Bắt đầu!'},
  week_label:{fr:'semaine',vi:'tuần'},
  weeks_word:{fr:'semaines',vi:'tuần'},
  trimester:{fr:['1ᵉʳ trimestre','2ᵉ trimestre','3ᵉ trimestre'],vi:['Tam cá nguyệt 1','Tam cá nguyệt 2','Tam cá nguyệt 3']},
  cd_weeks:{fr:'sem. faites',vi:'tuần rồi'},
  cd_left:{fr:'jours restants',vi:'ngày còn lại'},
  cd_done:{fr:'% du chemin',vi:'% chặng đường'},
  baby_now:{fr:'Ton bébé cette semaine',vi:'Em bé tuần này'},
  baby_size:{fr:'Taille d’un(e)',vi:'To bằng'},
  milestones:{fr:'Étapes importantes',vi:'Các cột mốc quan trọng'},
  ms_intro:{fr:'Coche au fur et à mesure. Les rendez-vous suivent le calendrier français.',vi:'Đánh dấu khi hoàn thành. Lịch hẹn theo chuẩn của Pháp.'},
  journal:{fr:'Mon journal de la semaine',vi:'Nhật ký tuần này'},
  journal_ph:{fr:'Comment te sens-tu ? Envies, symptômes, petits bonheurs…',vi:'Bạn cảm thấy thế nào? Thèm ăn, triệu chứng, niềm vui nhỏ…'},
  saved:{fr:'Enregistré ✓',vi:'Đã lưu ✓'},
  edit_date:{fr:'Modifier ma date',vi:'Sửa ngày'},
  food_title:{fr:'Ce que je peux manger',vi:'Mình ăn được gì'},
  food_intro:{fr:'Filtre par catégorie. Vert = oui, orange = prudence, rose = à éviter.',vi:'Lọc theo nhóm. Xanh = được, cam = cẩn thận, hồng = nên tránh.'},
  f_all:{fr:'Tout',vi:'Tất cả'},
  f_ok:{fr:'À volonté',vi:'Thoải mái'},
  f_warn:{fr:'Avec prudence',vi:'Cẩn thận'},
  f_no:{fr:'À éviter',vi:'Nên tránh'},
  search_food:{fr:'Chercher un aliment…',vi:'Tìm món ăn…'},
  rec_title:{fr:'Recettes faciles',vi:'Công thức dễ làm'},
  rec_intro:{fr:'Choisis selon tes envies, tes ingrédients ou un type de cuisine.',vi:'Chọn theo sở thích, nguyên liệu có sẵn hoặc kiểu ẩm thực.'},
  cuisine:{fr:'Cuisine',vi:'Ẩm thực'},
  craving:{fr:'Envie',vi:'Thèm gì'},
  ingredient:{fr:'Ingrédient',vi:'Nguyên liệu'},
  any:{fr:'Toutes',vi:'Tất cả'},
  any_ing:{fr:'Tous',vi:'Tất cả'},
  fav_only:{fr:'♡ Favoris',vi:'♡ Yêu thích'},
  ingredients:{fr:'Ingrédients',vi:'Nguyên liệu'},
  steps:{fr:'Préparation',vi:'Cách làm'},
  serves:{fr:'pers.',vi:'người'},
  mins:{fr:'min',vi:'phút'},
  move_title:{fr:'Bouger en douceur',vi:'Vận động nhẹ nhàng'},
  move_intro:{fr:'Exercices adaptés à chaque trimestre. Écoute toujours ton corps.',vi:'Bài tập phù hợp từng tam cá nguyệt. Luôn lắng nghe cơ thể.'},
  all_tri:{fr:'Tous',vi:'Tất cả'},
  t1:{fr:'1ᵉʳ tri.',vi:'TCN 1'},t2:{fr:'2ᵉ tri.',vi:'TCN 2'},t3:{fr:'3ᵉ tri.',vi:'TCN 3'},

/* ============================================================
   DATE MATH
============================================================ */
function computeWeek(){
  const dd=store.get('dueDate',null);
  if(!dd) return null;
  const due=new Date(dd+'T00:00:00');
  const today=new Date(); today.setHours(0,0,0,0);
  const msDay=86400000;
  const daysLeft=Math.round((due-today)/msDay);
  const daysPreg=280-daysLeft;                 // 40 weeks = 280 days
  let week=Math.floor(daysPreg/7);
  week=Math.max(0,Math.min(42,week));
  const pct=Math.max(0,Math.min(100,Math.round((daysPreg/280)*100)));
  const tri = week<14?0 : week<28?1 : 2;
  return {week,daysLeft:Math.max(0,daysLeft),pct,tri,due};
}

function setupCard(){
  const c=el('div','card tinted');
  c.innerHTML=`<h2 style="margin:0 0 8px;font-size:1.5rem">${esc(T(S.setup_title))}</h2>
    <p class="intro" style="margin:0 0 18px">${esc(T(S.setup_intro))}</p>`;
  const seg=el('div','seg');
  const modes=[['dd',T(S.mode_dd)],['lmp',T(S.mode_lmp)]];
  let mode='dd';
  modes.forEach(([k,label])=>{
    const b=el('button',null,esc(label));b.setAttribute('aria-pressed',mode===k);
    b.onclick=()=>{mode=k;seg.querySelectorAll('button').forEach((x,i)=>x.setAttribute('aria-pressed',modes[i][0]===mode));lab.textContent=mode==='dd'?T(S.by_dd):T(S.by_lmp);};
    seg.appendChild(b);
  });
  c.appendChild(seg);
  const f=el('div','field');f.style.marginTop='14px';
  const lab=el('label','fld',esc(T(S.by_dd)));
  const inp=el('input');inp.type='date';
  f.appendChild(lab);f.appendChild(inp);c.appendChild(f);
  const btn=el('button','btn',esc(T(S.save)));
  btn.onclick=()=>{
    if(!inp.value)return;
    let due;
    if(mode==='dd'){due=inp.value;}
    else{const d=new Date(inp.value+'T00:00:00');d.setDate(d.getDate()+280);due=d.toISOString().slice(0,10);}
    store.set('dueDate',due);viewWeek=null;renderSuivi();
  };
  c.appendChild(btn);
  return c;
}

function selField(label,opts,val,on){
  const f=el('div','field');f.style.marginBottom='10px';
  f.innerHTML=`<label class="fld">${esc(label)}</label>`;
  const s=el('select');
  Object.keys(opts).forEach(k=>{const o=el('option');o.value=k;o.textContent=T(opts[k]);if(k===val)o.selected=true;s.appendChild(o);});
  s.onchange=()=>on(s.value);
  f.appendChild(s);return f;
}

      </div>

      <ul>${T(r.ing).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      <h4>${esc(T(S.steps))}</h4>
      <ol>${T(r.step).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
      <div class="why">💚 ${esc(T(r.why))}</div>
    </div>`;
  const favBtn=c.querySelector('.fav');
  favBtn.onclick=e=>{e.stopPropagation();const f=store.get('favs',{});f[key]=!f[key];store.set('favs',f);favBtn.setAttribute('aria-pressed',!!f[key]);favBtn.textContent=f[key]?'♥':'♡';};
  c.querySelector('.head').onclick=()=>c.classList.toggle('open');

  return c;
}

  store.set('theme',theme);applyTheme(theme);
};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(store.get('theme','system')==='system')applyTheme('system');});

render();
</script>

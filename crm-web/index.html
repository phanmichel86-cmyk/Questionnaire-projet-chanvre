<title>CRM Chanvre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : barre latérale fixe + zone de travail dense ; sur téléphone, barre d'onglets en bas. Teintes de paille et de chanvre vert. */
:root {
  --bg: #f2f4f0; --surface: #ffffff; --surface-2: #e9ede6; --line: #d5dbd1; --line-2: #c3cbbf;
  --fg: #1a221c; --muted: #5b675e; --accent: #2c6a4d; --accent-hover: #245a41; --accent-fg: #ffffff; --accent-soft: #dbeadf;
  --straw: #b9922f; --straw-soft: #f4ecd5;
  --ok: #2d7a47; --ok-soft: #dcefe2; --warn: #9a620c; --warn-soft: #f8ead0; --bad: #b0372b; --bad-soft: #f8e0dc; --info: #2b5c87; --info-soft: #dde9f4;
  --shadow: 0 1px 2px rgba(22, 36, 26, .06), 0 6px 24px rgba(22, 36, 26, .08);
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111612; --surface: #19201b; --surface-2: #212a23; --line: #2d3830; --line-2: #3a473d;
  --fg: #e3eae4; --muted: #98a69b; --accent: #6dbd90; --accent-hover: #86cda4; --accent-fg: #0d1a12; --accent-soft: #1d3527;
  --straw: #d8b45a; --straw-soft: #33301f;
  --ok: #6cc48a; --ok-soft: #1b3324; --warn: #e2a648; --warn-soft: #382c16; --bad: #ef7d6e; --bad-soft: #3c1f1b; --info: #82b2de; --info-soft: #1b2b3b;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111612; --surface: #19201b; --surface-2: #212a23; --line: #2d3830; --line-2: #3a473d;
  --fg: #e3eae4; --muted: #98a69b; --accent: #6dbd90; --accent-hover: #86cda4; --accent-fg: #0d1a12; --accent-soft: #1d3527;
  --straw: #d8b45a; --straw-soft: #33301f;
  --ok: #6cc48a; --ok-soft: #1b3324; --warn: #e2a648; --warn-soft: #382c16; --bad: #ef7d6e; --bad-soft: #3c1f1b; --info: #82b2de; --info-soft: #1b2b3b;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 18px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }

/* Structure */
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line);
  padding: calc(18px + env(safe-area-inset-top, 0px)) 14px 18px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
.brand b { font-family: var(--f-display); font-size: 17px; display: block; line-height: 1.1; }
.brand span { font-size: 11px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a .cnt { margin-left: auto; font-family: var(--f-data); font-size: 11px; background: var(--bad); color: #fff; border-radius: 10px; padding: 1px 7px; }
.nav-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 6px; display: grid; gap: 4px; }
.mainwrap { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 10px; align-items: center; }
.search { position: relative; flex: 1; max-width: 520px; }
.search input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.sres { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; z-index: 20; }
.sres a { display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); }
.sres a:last-child { border-bottom: 0; }
.sres a:hover, .sres a.hl { background: var(--surface-2); }
main { padding-block: 22px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.phead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; justify-content: space-between; }
.phead .sub { color: var(--muted); margin-top: 4px; }
.phead > .grow { flex: 1 1 280px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grow { flex: 1; min-width: 0; }

/* Contrôles */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 13px; text-decoration: none; color: var(--fg); white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.pri:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger.armed { background: var(--bad); color: #fff; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.inp, select.inp, textarea.inp { padding: 7px 10px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface); min-width: 0; }
textarea.inp { width: 100%; min-height: 96px; resize: vertical; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip.straw { background: var(--straw-soft); color: var(--warn); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 12px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }

/* Blocs */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel > .ph { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel > .ph h2, .panel > .ph h3 { flex: 1; min-width: 0; }
.panel > .pb { padding: 12px 14px; }
.cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
.cols > * { min-width: 0; }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty b { color: var(--fg); font-family: var(--f-display); font-size: 16px; }
.banner { padding: 10px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.banner.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.banner.info { background: var(--info-soft); border-color: transparent; color: var(--info); }

/* Lignes d'action */
.alist { display: flex; flex-direction: column; }
.arow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.arow:last-child { border-bottom: 0; }
.arow:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--surface); cursor: pointer; display: grid; place-items: center; color: transparent; margin-top: 1px; padding: 0; }
.check:hover { border-color: var(--accent); color: var(--accent); }
.check.done { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.amain { cursor: pointer; min-width: 0; display: grid; gap: 2px; }
.aline1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.aline1 b { font-weight: 600; }
.aline2 { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.aline2 a { color: inherit; }
.acr { font-size: 13px; color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
.kv { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.kv b { color: var(--fg); font-weight: 600; }
.ameta { text-align: right; display: grid; gap: 2px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.ameta .d { font-family: var(--f-data); color: var(--fg); }
.late .ameta .d { color: var(--bad); }
.tchip { font-size: 11px; font-weight: 700; letter-spacing: .02em; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.tchip.rdv { background: var(--straw-soft); color: var(--warn); }
.tchip.vente { background: var(--accent-soft); color: var(--accent); }
.tchip.prosp { background: var(--info-soft); color: var(--info); }
.tchip.sav { background: var(--bad-soft); color: var(--bad); }

/* Tableaux */
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
table.t th small { display: block; text-transform: none; letter-spacing: 0; font-weight: 500; }
table.t td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--surface-2); }
table.t td.r, table.t th.r { text-align: right; }

/* Pipeline */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(205px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.kcol { background: var(--surface-2); border-radius: var(--r); display: flex; flex-direction: column; min-height: 160px; }
.kcol.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.khead { padding: 10px 12px; display: grid; gap: 2px; border-bottom: 1px solid var(--line); }
.khead b { font-family: var(--f-display); font-size: 14px; display: flex; justify-content: space-between; }
.kbody { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 10px; cursor: grab; display: grid; gap: 4px; }
.kcard:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.kcard.dragging { opacity: .5; }
.kcard .t1 { font-weight: 600; }
.kcard .fig { display: flex; gap: 10px; font-family: var(--f-data); font-size: 12px; }
.pcards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; cursor: pointer; text-decoration: none; color: var(--fg); }
.pcard:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.bar { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.stepper { display: flex; gap: 4px; flex-wrap: wrap; }
.stepper button { border: 1px solid var(--line-2); background: var(--surface); padding: 6px 10px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
.stepper button.past { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.stepper button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.stepper button.lost.on { background: var(--bad); border-color: var(--bad); color: #fff; }

/* Fiche */
.fhead { display: grid; gap: 10px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.facts > div { background: var(--surface); padding: 10px 14px; display: grid; gap: 2px; min-width: 0; }
.facts .v { font-family: var(--f-data); font-size: 15px; overflow-wrap: anywhere; }
.facts .v.txt { font-family: var(--f-body); font-size: 14px; }
.copy { border: 0; background: none; cursor: pointer; color: var(--accent); font-size: 12px; font-weight: 600; padding: 0 4px; }
.ctlist { display: grid; }
.ct { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; cursor: pointer; }
.ct:last-child { border-bottom: 0; }
.ct:hover { background: var(--surface-2); }
.jal { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.jal:last-child { border-bottom: 0; }
.jal.done .jt { text-decoration: line-through; color: var(--muted); }

/* Indicateurs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; }
.kpi .v { font-family: var(--f-data); font-size: 24px; letter-spacing: -.02em; }
.kpi .v small { font-size: 13px; color: var(--muted); margin-left: 3px; }
.kpi.alert .v { color: var(--bad); }
.chart { display: grid; gap: 8px; }
.vbars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; align-items: end; height: 170px; border-bottom: 1px solid var(--line-2); padding-top: 18px;
  background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 25%; }
.vbars .b { position: relative; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
.vbars .b.cur { background: var(--straw); }
.vbars .b span { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-family: var(--f-data); font-size: 11px; color: var(--fg); }
.vlabels { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; font-size: 10px; color: var(--muted); text-align: center; font-family: var(--f-data); }
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 34%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.hbar .tr { height: 14px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.hbar .tr i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.hbar .val { font-family: var(--f-data); font-size: 12px; min-width: 70px; text-align: right; }
.src { font-size: 12px; color: var(--muted); }

/* Agenda */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-height: 140px; display: flex; flex-direction: column; min-width: 0; }
.day.today { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.day .dh { padding: 8px 10px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
.day .dh .num { color: var(--muted); font-size: 12px; }
.day .di { padding: 6px; display: grid; gap: 5px; }
.ev { font-size: 12px; padding: 6px 8px; border-radius: 5px; background: var(--surface-2); cursor: pointer; display: grid; gap: 1px; border-left: 3px solid var(--line-2); overflow-wrap: anywhere; }
.ev.rdv { border-left-color: var(--straw); background: var(--straw-soft); }
.ev.fait { opacity: .62; }
.ev .h { font-family: var(--f-data); font-size: 11px; color: var(--muted); }

/* Tiroir de saisie */
.drawer-wrap { position: fixed; inset: 0; z-index: 40; }
.scrim { position: absolute; inset: 0; background: rgba(10, 18, 12, .42); }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dh2 { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dh2 h2 { flex: 1; }
.dbody { flex: 1; overflow-y: auto; padding: 16px 18px; display: grid; gap: 14px; align-content: start; }
.dfoot { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.dfoot .grow { flex: 1; }
#dform { display: grid; gap: 14px; }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld > span { font-size: 12px; font-weight: 600; color: var(--muted); }
.fld > span em { font-style: normal; font-weight: 500; }
.fld .inp { width: 100%; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.fset { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 12px; margin: 0; }
.fset legend { padding: 0 6px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line-2); padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 13px; }
.checks input:checked + span { color: var(--accent); font-weight: 600; }
.combo { position: relative; }
.combo .opts { position: absolute; top: calc(100% + 2px); left: 0; right: 0; max-height: 240px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 7px; box-shadow: var(--shadow); z-index: 5; }
.combo .opts button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
.combo .opts button:hover { background: var(--surface-2); }
.lines { display: grid; gap: 8px; }
.line { display: grid; grid-template-columns: minmax(0, 2fr) minmax(70px, 1fr) minmax(80px, 1fr) auto; gap: 6px; align-items: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); z-index: 60; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }

  const byDateDesc = (x, y) => ((y.date || '') + (y.heure || '')).localeCompare((x.date || '') + (x.heure || ''));
  for (const l of bySoc.values()) l.sort(byDateDesc);
  for (const l of byProj.values()) l.sort(byDateDesc);
  IX = { bySoc, byProj, ctBySoc, prBySoc, last, next, nextProj, lastProj }; IXv = S.ver;
  return IX;
}
const byWhen = (x, y) => ((x.date || '9') + (x.heure || '')).localeCompare((y.date || '9') + (y.heure || ''));

/* ---------- Base de données ---------- */
async function boot() {
  route(); render();
  if (!window.claude || !window.claude.use) { S.status = 'absent'; render(); return; }
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  S.user = user;
  if (!db) { S.status = 'absent'; render(); return; }
  S.db = db;
  if (user) {
    S.me = await user.id();
    const c = await user.can('data.write');
    if (c === false) S.canWrite = false;
  }
  const confirmed = new Set();
  const timer = setTimeout(() => { if (confirmed.size < COLLS.length) { S.slow = true; scheduleRender(); } }, 10000);
  for (const c of COLLS) {
    db.collection(c).onSnapshot(snap => {
      const m = new Map(); for (const d of snap.docs) m.set(d.id, d.data());
      S[c] = m; S.loaded.add(c);
      if (!snap.metadata.fromCache) confirmed.add(c);
      if (S.loaded.size === COLLS.length) S.status = 'ready';
      if (confirmed.size === COLLS.length) { clearTimeout(timer); S.slow = false; }
      S.ver++; refreshNames(); scheduleRender();
    }, err => {
      clearTimeout(timer); S.err = err.code; S.status = S.loaded.size ? 'ready' : 'error'; scheduleRender();
    });
  }
}
let namesBusy = false;
async function refreshNames() {
  if (!S.user || namesBusy) return; namesBusy = true;
  try {
    const ids = new Set(S.me ? [S.me] : []);
    for (const c of ['societes', 'actions', 'projets']) for (const v of S[c].values()) for (const k of ['responsable', 'assigne', 'creePar']) if (v[k]) ids.add(v[k]);
    const list = [...ids]; if (!list.length) return;
    const ps = await S.user.profiles(list);
    let ch = false;
    for (const id of list) { const n = ps[id]?.name || ''; if (S.names[id] !== n) { S.names[id] = n; ch = true; } }
    if (ch) scheduleRender();
  } finally { namesBusy = false; }
}
function people() {
  const ids = Object.keys(S.names).filter(id => id !== S.me);
  ids.sort((a, b) => (S.names[a] || '').localeCompare(S.names[b] || ''));
  return S.me ? [S.me, ...ids] : ids;
}
async function save(coll, id, data, isNew) {
  if (!S.db) { toast("La base de données n'est pas disponible sur cette page."); return false; }
  const now = new Date().toISOString();
  const body = clean({ ...data, maj: now, majPar: S.me || null, ...(isNew ? { cree: now, creePar: S.me || null } : {}) });
  try { await S.db.collection(coll).doc(id).set(body); return true; }
  catch (e) { return dbFail(e); }
}
async function remove(coll, id) {
  try { await S.db.collection(coll).doc(id).delete(); return true; } catch (e) { return dbFail(e); }
}
function dbFail(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') { S.canWrite = false; toast("Vous n'avez pas le droit de modifier ces données. Demandez au propriétaire de vous passer « Contributeur »."); render(); }
  else if (c === 'quota_exceeded') toast("La base est pleine (25 000 fiches au maximum). Supprimez d'anciennes actions pour continuer.");
  else if (c === 'resource_exhausted') toast('Trop de modifications en même temps. Réessayez dans quelques secondes.');
  else toast("L'enregistrement n'a pas abouti. Vérifiez la connexion et réessayez.");
  return false;
}

const ROUTES = ['journee', 'relances', 'agenda', 'actions', 'societes', 'contacts', 'projets', 'tableau', 'import'];
function route() {
  const hsh = location.hash.replace(/^#/, '');

  if (m) { S.route = m[1]; S.param = m[2]; }
  else { S.route = ROUTES.includes(hsh) ? hsh : 'journee'; S.param = ''; }
  S.showMore = 0;
}
addEventListener('hashchange', () => { route(); closeSide(); render(); window.scrollTo(0, 0); });
const go = r => { location.hash = r; };

function navCounts() {
  const t = today(); let late = 0;
  for (const a of S.actions.values()) if (a.statut === 'a_faire' && a.date && a.date < t && (a.assigne || a.creePar) === S.me) late++;
  return { late };
}
function renderNav() {

  const items = [
    ['journee', 'Ma journée', ICON.day], ['relances', 'À relancer', ICON.bell, late], ['agenda', 'Agenda', ICON.cal], ['actions', 'Journal des actions', ICON.list], 'sep',

function openSide() { $('#side').classList.add('open'); if (!$('.side-scrim')) { const d = document.createElement('div'); d.className = 'side-scrim'; d.dataset.act = 'close-side'; document.body.appendChild(d); } }
function closeSide() { $('#side').classList.remove('open'); $('.side-scrim')?.remove(); }

/* ---------- Rendu ---------- */
let rq = false;
function scheduleRender() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
function render() {
  const a = document.activeElement, main = $('#main');
  const fid = a && a.id && main.contains(a) ? a.id : null;
  const sel = fid && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
  renderNav();
  let html;
  if (S.status === 'loading' && !S.slow) html = `<div class="page"><div class="empty"><b>Chargement des données…</b><span>Les sociétés, contacts, actions et projets arrivent.</span></div></div>`;
  else if (S.status === 'absent' || S.status === 'error') html = vNoDb();
  else html = (VIEWS[S.route] || vJournee)();
  main.innerHTML = (S.slow ? `<div class="page" style="margin-bottom:14px"><div class="banner warn">La base ne répond pas encore. Les données affichées peuvent ne pas être à jour.</div></div>` : '') + html;
  if (fid) { const e = document.getElementById(fid); if (e) { e.focus(); if (sel && e.setSelectionRange) { try { e.setSelectionRange(sel[0], sel[1]); } catch (x) {} } } }
  afterRender();
}

/* --- Agenda --- */

/* --- Journal des actions --- */

    <div class="row">

        <td class="hide-sm small">${h((s.segments || []).join(', '))}</td><td><span class="chip ${st?.c}">${h(st?.l)}</span></td>
        <td>${l ? `<span class="num small">${h(fmtD(l.date))}</span><div class="small muted">${h(TYPE[l.type]?.l || '')}</div>` : '<span class="muted small">—</span>'}</td>
        <td class="hide-sm">${n ? `<span class="num small ${n.date && n.date < today() ? 'chip bad' : ''}">${h(n.date ? fmtD(n.date) : 'Sans date')}</span><div class="small muted">${h(n.titre || TYPE[n.type]?.l || '')}</div>` : '<span class="muted small">Aucune</span>'}</td>
        <td class="hide-sm small">${h(who(s.responsable))}</td></tr>`; }).join('')}</tbody></table></div>
      ${list.length > lim ? `<div class="pb"><button class="btn" data-act="more">Afficher 200 de plus</button></div>` : ''}`
      : emptyBox(S.societes.size ? 'Aucune société ne correspond' : 'Aucune société pour le moment', S.societes.size ? 'Modifiez les filtres.' : 'Importez votre fichier clients ou créez une société.',
        S.societes.size ? '' : `<div class="row"><a class="btn pri" href="#import">Importer un fichier Excel</a><button class="btn" data-act="new-societe" ${ro()}>Créer une société</button></div>`)}</section>
  </div>`;
}

}

/* --- Fiche société --- */
const copyBtn = v => v ? `<button class="copy" data-act="copy" data-v="${h(v)}">Copier</button>` : '';
const telLink = v => v ? `<a href="tel:${h(String(v).replace(/[^\d+]/g, ''))}" class="num">${h(v)}</a>${copyBtn(v)}` : '<span class="muted">—</span>';
function vFiche() {
  const s = soc(S.param);
  if (!s) return `<div class="page"><div class="panel">${emptyBox('Société introuvable', 'Elle a peut-être été supprimée.', '<a class="btn" href="#societes">Retour aux sociétés</a>')}</div></div>`;

  const acts = X.bySoc.get(id) || [];
  const todo = acts.filter(a => a.statut === 'a_faire').sort(byWhen);
  const done = acts.filter(a => a.statut === 'fait');
  const cts = (X.ctBySoc.get(id) || []).sort((a, b) => (a.nom || '').localeCompare(b.nom || ''));
  const prs = X.prBySoc.get(id) || [];
  const last = X.last.get(id);
  return `<div class="page">
    <div class="fhead">
      <div class="row small"><a href="#societes">Sociétés</a><span class="muted">/</span></div>
      <div class="phead"><div class="grow"><h1>${h(s.nom)}</h1>
        <div class="row" style="margin-top:8px"><span class="chip ${st?.c}">${h(st?.l)}</span>${(s.segments || []).map(x => `<span class="chip">${h(x)}</span>`).join('')}${s.univers ? `<span class="chip straw">${h(s.univers)}</span>` : ''}${s.codeTiers ? `<span class="chip mono">${h(s.codeTiers)}</span>` : ''}</div></div>
        <div class="row"><button class="btn pri" data-act="new-action" data-societe="${h(id)}" ${ro()}>+ Action</button><button class="btn" data-act="new-projet" data-societe="${h(id)}" ${ro()}>+ Projet</button><button class="btn" data-act="new-contact" data-societe="${h(id)}" ${ro()}>+ Contact</button><button class="btn ghost" data-act="edit-societe" data-id="${h(id)}" ${ro()}>Modifier</button></div>
      </div>
      <div class="facts">
        <div><span class="label">Téléphone</span><span class="v">${telLink(s.tel)}</span></div>
        <div><span class="label">Mail</span><span class="v txt">${s.email ? `${h(s.email)}${copyBtn(s.email)}` : '<span class="muted">—</span>'}</span></div>
        <div><span class="label">Ville</span><span class="v txt">${h([s.cp, s.ville].filter(Boolean).join(' ') || '—')}${s.pays ? ` · ${h(s.pays)}` : ''}</span></div>
        <div><span class="label">Responsable</span><span class="v txt">${h(who(s.responsable))}</span></div>
        <div><span class="label">Dernier contact</span><span class="v txt">${last ? `${h(fmtD(last.date))} <span class="muted small">${h(relDays(last.date))}</span>` : '—'}</span></div>
        <div><span class="label">Source</span><span class="v txt">${h(s.source || '—')}</span></div>
      </div>
      ${s.notes ? `<div class="banner" style="white-space:pre-wrap">${h(s.notes)}</div>` : ''}
    </div>
    <div class="cols">
      <div style="display:grid;gap:16px">
        ${panel('Prochaines actions', todo.length ? `<div class="alist">${todo.map(a => rowAction(a, { noSoc: 1 })).join('')}</div>` : emptyBox('Aucune action prévue', '', `<button class="btn sm" data-act="new-action" data-societe="${h(id)}" data-type="relance" ${ro()}>Planifier une relance</button>`), `<span class="chip">${todo.length}</span>`)}
        ${panel('Historique des échanges', done.length ? `<div class="alist">${done.map(a => rowAction(a, { noSoc: 1, cr: 1 })).join('')}</div>` : emptyBox('Aucun échange noté', 'Chaque appel, mail ou rendez-vous noté apparaîtra ici.'), `<span class="chip">${done.length}</span>`)}
      </div>
      <div style="display:grid;gap:16px">
        ${panel('Projets et affaires', prs.length ? `<div class="alist">${prs.map(p => `<a class="ct" href="#projet-${h(p.id)}" style="text-decoration:none;color:inherit"><div class="aline1"><b>${h(p.titre)}</b>${projChip(p)}</div><div class="small muted">${h(NATURES[p.nature])}${p.montant ? ` · <span class="num">${eur(p.montant)}</span>` : ''}${p.tonnes ? ` · <span class="num">${ton(p.tonnes)}</span>` : ''}</div></a>`).join('')}</div>` : emptyBox('Aucun projet', ''), `<button class="btn sm ghost" data-act="new-projet" data-societe="${h(id)}" ${ro()}>+ Projet</button>`)}
        ${panel('Contacts', cts.length ? `<div class="ctlist">${cts.map(c => `<div class="ct" data-act="edit-contact" data-id="${h(c.id)}"><div class="aline1"><b>${h(ctName(c))}</b>${c.role ? `<span class="chip">${h(c.role)}</span>` : ''}</div>
            <div class="small muted">${h(c.fonction || '')}${c.langue && c.langue !== 'Français' ? ' · ' + h(c.langue) : ''}</div>
            <div class="small">${c.portable ? `<span class="num">${h(c.portable)}</span> ` : ''}${c.tel ? `<span class="num">${h(c.tel)}</span> ` : ''}${c.email ? h(c.email) : ''}</div></div>`).join('')}</div>` : emptyBox('Aucun contact', ''), `<button class="btn sm ghost" data-act="new-contact" data-societe="${h(id)}" ${ro()}>+ Contact</button>`)}

function projChip(p) {
  if (p.nature === 'affaire') { const e = ETAPE[p.etape] || ETAPES[0]; return `<span class="chip ${p.etape === 'gagnee' ? 'ok' : p.etape === 'perdue' ? 'bad' : 'acc'}">${h(e.l)}</span>`; }
  const s = STATUT_P[p.statut] || STATUTS_P[0]; return `<span class="chip ${s.c}">${h(s.l)}</span>`;
}

/* --- Projets --- */
function projMontant(p) { return +p.montant || 0; }
function vProjets() {
  const tab = S.f.projTab, quiF = S.f.projQui, X = ix();
  const list = all('projets').filter(p => !quiF || (p.responsable || p.creePar) === quiF);
  const tabs = [['pipeline', 'Pipeline des affaires'], ['client', 'Projets clients'], ['interne', 'Projets internes']];
  let body;
  if (tab === 'pipeline') {
    const aff = list.filter(p => p.nature === 'affaire');
    body = `<div class="kanban" id="kanban">${ETAPES.map(e => { const its = aff.filter(p => (p.etape || 'contact') === e.k).sort((a, b) => (a.dateDecision || '9').localeCompare(b.dateDecision || '9'));
      const sum = its.reduce((s, p) => s + projMontant(p), 0);
      return `<div class="kcol" data-drop="${e.k}"><div class="khead"><b><span>${h(e.l)}</span><span class="num">${its.length}</span></b><span class="small muted num">${eur(sum)} · ${e.p} %</span></div>
        <div class="kbody">${its.map(p => { const n = X.nextProj.get(p.id);
          return `<div class="kcard" draggable="${S.canWrite}" data-drag="${h(p.id)}" data-act="go" data-to="projet-${h(p.id)}"><span class="t1">${h(p.titre)}</span><span class="small muted">${h(socName(p.societeId))}</span>
          <span class="fig">${p.montant ? `<span>${eur(p.montant)}</span>` : ''}${p.tonnes ? `<span>${ton(p.tonnes)}</span>` : ''}</span>
          ${!['gagnee', 'perdue'].includes(e.k) ? (n ? `<span class="small ${n.date && n.date < today() ? 'chip bad' : 'muted'}">Prochaine : ${h(n.date ? fmtD(n.date) : 'sans date')}</span>` : '<span class="chip warn" style="justify-self:start">Aucune prochaine action</span>') : ''}</div>`; }).join('')}
        ${e.k === 'contact' ? `<button class="btn sm ghost" data-act="new-projet" data-nature="affaire" ${ro()}>+ Affaire</button>` : ''}</div></div>`; }).join('')}</div>
      <div class="src">Glissez une carte d'une colonne à l'autre pour changer d'étape, ou ouvrez l'affaire. Montant par colonne = somme des montants estimés, en euros ; le pourcentage est la probabilité par défaut de l'étape.</div>`;
  } else {
    const pl = list.filter(p => p.nature === tab).sort((a, b) => (STATUTS_P.findIndex(s => s.k === a.statut) - STATUTS_P.findIndex(s => s.k === b.statut)) || (a.echeance || '9').localeCompare(b.echeance || '9'));
    body = pl.length ? `<div class="pcards">${pl.map(p => { const j = p.jalons || [], d = j.filter(x => x.fait).length, nj = j.filter(x => !x.fait).sort((a, b) => (a.date || '9').localeCompare(b.date || '9'))[0];
      return `<a class="pcard" href="#projet-${h(p.id)}"><div class="aline1"><b class="grow">${h(p.titre)}</b>${projChip(p)}</div>
      <span class="small muted">${p.societeId ? h(socName(p.societeId)) : 'Projet interne'} · ${h(who(p.responsable))}</span>
      ${j.length ? `<div class="bar" aria-label="${d} jalons sur ${j.length}"><i style="width:${Math.round(100 * d / j.length)}%"></i></div><span class="small">${d} / ${j.length} jalons${nj ? ` · prochain : ${h(nj.titre)}${nj.date ? ' (' + h(fmtD(nj.date)) + ')' : ''}` : ''}</span>` : '<span class="small muted">Aucun jalon</span>'}
      ${p.echeance ? `<span class="small">Échéance : <span class="num">${h(fmtD(p.echeance))}</span></span>` : ''}</a>`; }).join('')}</div>`
      : `<div class="panel">${emptyBox(tab === 'client' ? 'Aucun projet client' : 'Aucun projet interne', tab === 'client' ? 'Un chantier, une homologation, un contrat annuel en plusieurs livraisons…' : 'Un salon, un nouveau produit, un partenariat…', `<button class="btn pri" data-act="new-projet" data-nature="${tab}" ${ro()}>Créer un projet</button>`)}</div>`;
  }
  return `<div class="page">
    <div class="phead"><div><h1>Projets et affaires</h1><div class="sub">${list.filter(p => p.nature === 'affaire' && !['gagnee', 'perdue'].includes(p.etape)).length} affaires ouvertes · ${list.filter(p => p.nature !== 'affaire' && p.statut === 'en_cours').length} projets en cours</div></div>
      <div class="row"><select id="f-projQui" class="inp" data-f="projQui"><option value="">Tout le monde</option>${people().map(id => `<option value="${h(id)}" ${quiF === id ? 'selected' : ''}>${h(who(id))}</option>`).join('')}</select>
      <button class="btn pri" data-act="new-projet" data-nature="${tab === 'pipeline' ? 'affaire' : tab}" ${ro()}>+ ${tab === 'pipeline' ? 'Affaire' : 'Projet'}</button></div></div>
    <div class="tabs">${tabs.map(([k, l]) => `<button data-act="setf" data-k="projTab" data-v="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${body}
  </div>`;
}

    </div>
    <div class="cols">
      <div style="display:grid;gap:16px">
        ${panel('Prochaines actions', todo.length ? `<div class="alist">${todo.map(a => rowAction(a, { noProj: 1 })).join('')}</div>` : emptyBox('Aucune action prévue', '', `<button class="btn sm" data-act="new-action" data-projet="${h(id)}" data-societe="${h(p.societeId || '')}" ${ro()}>Planifier la suite</button>`))}

function vTableau() {
  const t = today(), mine = S.f.dashQui === 'moi';
  const acts = all('actions').filter(a => !mine || isMine(a));
  const faits = acts.filter(a => a.statut === 'fait');
  const projs = all('projets').filter(p => !mine || isMine(p, 'responsable'));
  const ouvertes = projs.filter(p => p.nature === 'affaire' && !['gagnee', 'perdue'].includes(p.etape || 'contact'));
  const pond = ouvertes.reduce((s, p) => s + projMontant(p) * (p.proba ?? ETAPE[p.etape || 'contact'].p) / 100, 0);
  const tonnes = ouvertes.reduce((s, p) => s + (+p.tonnes || 0), 0);
  const f7 = faits.filter(a => a.date > addDays(t, -7) && a.date <= t).length;
  const rdv7 = acts.filter(a => a.statut === 'a_faire' && TYPE[a.type]?.rdv && a.date >= t && a.date <= addDays(t, 7)).length;
  const late = acts.filter(a => a.statut === 'a_faire' && a.date && a.date < t).length;
  // Actions faites par semaine, 12 semaines
  const ws0 = weekStart(t), weeks = [...Array(12)].map((_, i) => addDays(ws0, -7 * (11 - i)));
  const perW = weeks.map(w => faits.filter(a => a.date >= w && a.date < addDays(w, 7)).length);
  const maxW = Math.max(4, ...perW);
  // Pipeline par étape
  const stages = ETAPES.filter(e => !['gagnee', 'perdue'].includes(e.k)).map(e => { const its = ouvertes.filter(p => (p.etape || 'contact') === e.k); return { l: e.l, n: its.length, v: its.reduce((s, p) => s + projMontant(p), 0) }; });
  const maxS = Math.max(1, ...stages.map(s => s.v));
  // Types d'action, 90 jours
  const byT = {}; for (const a of faits.filter(a => a.date > addDays(t, -90))) byT[a.type] = (byT[a.type] || 0) + 1;
  const tl = Object.entries(byT).sort((a, b) => b[1] - a[1]).slice(0, 10); const maxT = Math.max(1, ...tl.map(x => x[1]));
  // Exercice septembre → août
  const ex = fy(t), closed = projs.filter(p => p.nature === 'affaire' && ['gagnee', 'perdue'].includes(p.etape) && fy((p.dateCloture || p.maj || t).slice(0, 10)) === ex);
  const won = closed.filter(p => p.etape === 'gagnee'), lost = closed.filter(p => p.etape === 'perdue');
  const wonV = won.reduce((s, p) => s + projMontant(p), 0), lostV = lost.reduce((s, p) => s + projMontant(p), 0);
  const motifs = {}; for (const p of lost) motifs[p.motifPerte || 'Non renseigné'] = (motifs[p.motifPerte || 'Non renseigné'] || 0) + 1;
  const fmtW = w => { const d = parseD(w); return `${d.getDate()}/${d.getMonth() + 1}`; };
  return `<div class="page">
    <div class="phead"><div><h1>Tableau de bord</h1><div class="sub">Activité commerciale et affaires en cours</div></div>${seg('dashQui', [['moi', 'Moi'], ['equipe', "Toute l'équipe"]])}</div>
    <div class="kpis">
      <div class="kpi"><span class="label">Actions faites, 7 jours</span><span class="v">${f7}</span></div>
      <div class="kpi"><span class="label">Rendez-vous, 7 prochains jours</span><span class="v">${rdv7}</span></div>
      <div class="kpi ${late ? 'alert' : ''}"><span class="label">Actions en retard</span><span class="v">${late}</span></div>
      <div class="kpi"><span class="label">Affaires ouvertes</span><span class="v">${ouvertes.length}</span></div>
      <div class="kpi"><span class="label">Montant pondéré</span><span class="v">${nf0.format(pond)}<small>€</small></span></div>
      <div class="kpi"><span class="label">Tonnage en jeu</span><span class="v">${nf1.format(tonnes)}<small>t</small></span></div>
    </div>
    <div class="cols">
      ${panel('Actions faites par semaine', `<div class="pb chart"><div class="label">Nombre d'actions</div>
        <div class="vbars">${perW.map((n, i) => `<div class="b ${i === 11 ? 'cur' : ''}" style="height:${(100 * n / maxW).toFixed(1)}%" title="Semaine du ${fmtW(weeks[i])} : ${n} actions"><span>${n || ''}</span></div>`).join('')}</div>
        <div class="vlabels">${weeks.map(fmtW).map((w, i) => `<span>${i % 2 ? '' : w}</span>`).join('')}</div>
        <div class="src">Actions marquées « fait », par semaine (lundi), sur 12 semaines. La barre ocre est la semaine en cours.</div></div>`)}
      ${panel('Affaires ouvertes par étape', `<div class="pb chart"><div class="hbars">${stages.map(s => `<div class="hbar"><span>${h(s.l)} <span class="muted small">(${s.n})</span></span><div class="tr"><i style="width:${(100 * s.v / maxS).toFixed(1)}%"></i></div><span class="val">${eur(s.v)}</span></div>`).join('')}</div>
        <div class="src">Montant estimé non pondéré, en euros. Pondéré par la probabilité : ${eur(pond)}.</div></div>`)}
      ${panel('Types d\'actions, 90 jours', `<div class="pb chart">${tl.length ? `<div class="hbars">${tl.map(([k, n]) => `<div class="hbar"><span>${h(TYPE[k]?.l || k)}</span><div class="tr"><i style="width:${(100 * n / maxT).toFixed(1)}%"></i></div><span class="val">${n}</span></div>`).join('')}</div>` : '<div class="muted">Aucune action faite sur la période.</div>'}
        <div class="src">Nombre d'actions faites sur les 90 derniers jours, par type.</div></div>`)}
      ${panel(`Exercice ${ex} · sept. ${ex - 1} → août ${ex}`, `<div class="pb chart"><div class="facts" style="margin-bottom:6px">
        <div><span class="label">Gagnées</span><span class="v">${won.length} · ${eur(wonV)}</span></div><div><span class="label">Perdues</span><span class="v">${lost.length} · ${eur(lostV)}</span></div>
        <div><span class="label">Taux de réussite</span><span class="v">${closed.length ? Math.round(100 * won.length / closed.length) + ' %' : '—'}</span></div></div>
        ${lost.length ? `<div class="label">Motifs de perte</div><div class="row">${Object.entries(motifs).map(([m, n]) => `<span class="chip bad">${h(m)} · ${n}</span>`).join('')}</div>` : ''}
        <div class="src">Affaires passées à « Gagnée » ou « Perdue » pendant l'exercice. Taux = gagnées ÷ affaires closes, en nombre.</div></div>`)}
    </div>
  </div>`;
}

let xlsxP = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxP) xlsxP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => { xlsxP = null; rej(); }; document.head.appendChild(s); });
  return xlsxP;
}
async function readImport(file) {
  S.imp = { loading: 1 }; render();
  try {
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    S.imp = { name: file.name, wb, sheets: wb.SheetNames, statut: 'client', seg: '' };
    setSheet(wb.SheetNames[0]);
  } catch (e) { S.imp = null; toast("Le fichier n'a pas pu être lu. Vérifiez qu'il s'agit d'un fichier Excel ou CSV."); render(); }
}
function setSheet(name) {
  const I = S.imp, ws = I.wb.Sheets[name];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
  let hi = raw.findIndex(r => r.filter(c => String(c).trim()).length >= 2); if (hi < 0) hi = 0;
  I.sheet = name; I.headers = (raw[hi] || []).map(c => String(c).trim());
  I.rows = raw.slice(hi + 1).filter(r => r.some(c => String(c).trim()));
  I.map = {}; I.done = null; I.progress = null;
  for (const [k, , re] of IMP_FIELDS) { const i = I.headers.findIndex((c, idx) => re.test(norm(c)) && !Object.values(I.map).includes(idx)); if (i >= 0) I.map[k] = i; }
  render();
}
async function runImport() {
  const I = S.imp; if (!I || I.map.nom == null) return;
  const byCode = new Map(), byName = new Map();
  for (const s of all('societes')) { if (s.codeTiers) byCode.set(norm(s.codeTiers), s); byName.set(norm(s.nom), s); }
  const jobs = []; let skipped = 0;
  for (const r of I.rows) {
    const v = {}; for (const [k] of IMP_FIELDS) if (I.map[k] != null) { const x = String(r[I.map[k]] ?? '').trim(); if (x) v[k] = x; }
    if (!v.nom) { skipped++; continue; }
    const ex = (v.codeTiers && byCode.get(norm(v.codeTiers))) || byName.get(norm(v.nom));
    if (ex) {
      const add = {}; for (const k in v) if (!ex[k]) add[k] = v[k];
      if (!Object.keys(add).length) { skipped++; continue; }
      const { id, ...rest } = ex; jobs.push({ id, data: { ...rest, ...add }, isNew: false });
    } else {
      const id = newId(); const d = { ...v, statut: I.statut, segments: I.seg ? [I.seg] : [], responsable: S.me || null };
      jobs.push({ id, data: d, isNew: true }); byName.set(norm(v.nom), { id, ...d }); if (v.codeTiers) byCode.set(norm(v.codeTiers), { id, ...d });
    }
  }
  I.total = jobs.length; I.progress = 0; render();
  let created = 0, updated = 0, k = 0, failed = false;
  const worker = async () => { while (k < jobs.length && !failed) { const j = jobs[k++]; const ok = await save('societes', j.id, j.data, j.isNew); if (!ok) { failed = true; break; } j.isNew ? created++ : updated++; I.progress++; if (I.progress % 10 === 0) scheduleRender(); } };
  await Promise.all([worker(), worker(), worker(), worker()]);
  I.done = { created, updated, skipped: skipped + (failed ? jobs.length - created - updated : 0) };
  render();
  toast(failed ? "L'import s'est arrêté avant la fin." : `${created} sociétés créées, ${updated} complétées.`);
}

async function submitForm(f) {
  const kind = f.dataset.form, id = f.dataset.id, isNew = !id, fd = new FormData(f), g = k => (fd.get(k) ?? '').toString().trim();
  if (kind === 'action') {
    const nid = id || newId(), prev = S.actions.get(nid) || {}, T = TYPE[g('type')];
    const champs = {}; for (const [k, v] of fd) if (k.startsWith('c_') && String(v).trim()) champs[k.slice(2)] = String(v).trim();
    let assigne = g('assigne'); if (assigne === '__search') assigne = S.me;
    const d = { ...prev, type: g('type'), statut: g('statut'), titre: g('titre'), date: g('date'), heure: g('heure'), duree: num(g('duree')), societeId: g('societeId'), contactId: g('contactId'), projetId: g('projetId'), assigne: assigne || S.me || null, compteRendu: g('compteRendu'), champs };
    if (d.statut === 'fait' && prev.statut !== 'fait') d.faitLe = today();
    if (!(await save('actions', nid, d, isNew))) return;
    if (d.statut === 'fait' && fd.get('suivi_on')) {
      await save('actions', newId(), { type: g('suivi_type'), statut: 'a_faire', titre: g('suivi_titre'), date: g('suivi_date'), societeId: d.societeId, contactId: d.contactId, projetId: d.projetId, assigne: d.assigne, champs: {} }, true);
      toast(`Enregistré. Suite prévue le ${fmtD(g('suivi_date'))}.`);
    } else toast(`${T?.l || 'Action'} enregistrée.`);
    closeDrawer();
  } else if (kind === 'societe') {
    const nid = id || newId(), prev = S.societes.get(nid) || {};
    const d = { ...prev, nom: g('nom'), statut: g('statut'), codeTiers: g('codeTiers'), segments: fd.getAll('segments'), univers: g('univers'), tel: g('tel'), email: g('email'), adresse: g('adresse'), cp: g('cp'), ville: g('ville'), pays: g('pays'), site: g('site'), source: g('source'), responsable: g('responsable') === '__search' ? (prev.responsable || S.me) : g('responsable'), notes: g('notes') };
    if (!(await save('societes', nid, d, isNew))) return;
    closeDrawer(); toast('Société enregistrée.'); if (isNew) go('fiche-' + nid);
  } else if (kind === 'contact') {

    const cons = !!fd.get('consentement');
    const d = { ...prev, societeId: g('societeId'), prenom: g('prenom'), nom: g('nom'), fonction: g('fonction'), role: g('role'), email: g('email'), portable: g('portable'), tel: g('tel'), langue: g('langue'), consentement: cons, consentementLe: cons ? (prev.consentementLe || today()) : '', notes: g('notes') };

    const lignes = []; const P = fd.getAll('l_produit'), Tn = fd.getAll('l_tonnes'), Px = fd.getAll('l_prix');
    P.forEach((pr, i) => { const t = num(Tn[i]), x = num(Px[i]); if (pr || t != null || x != null) lignes.push({ produit: pr, tonnes: t, prix: x }); });
    const nature = g('nature');

    if (nature === 'affaire') {
      Object.assign(d, { etape: g('etape'), proba: num(g('proba')) ?? ETAPE[g('etape')].p, dateDecision: g('dateDecision'), motifPerte: g('etape') === 'perdue' ? g('motifPerte') : '', lignes, tonnes: num(g('tonnes')), montant: num(g('montant')), source: g('source') });
      if (['gagnee', 'perdue'].includes(d.etape) && prev.etape !== d.etape) d.dateCloture = today();
    } else Object.assign(d, { statut: g('statut'), debut: g('debut'), echeance: g('echeance'), jalons: prev.jalons || [] });

/* ---------- Événements ---------- */
let armed = null;
document.addEventListener('click', async e => {
  if (!e.target.closest('.search')) $('#gres').hidden = true;
  const link = e.target.closest('a[href]');
  const el = e.target.closest('[data-act]');
  // Un lien placé dans une ligne cliquable l'emporte sur l'action de la ligne.
  if (link && (!el || el.contains(link))) { if (!$('#dwrap').hidden && $('#drawer').contains(link)) closeDrawer(); return; }
  if (!el) return;
  const d = el.dataset, act = d.act;
  if (act !== 'del' && armed) { armed.classList.remove('armed'); armed.textContent = 'Supprimer'; armed = null; }
  switch (act) {
    case 'go': go(d.to); break;
    case 'menu': $('#side').classList.contains('open') ? closeSide() : openSide(); break;
    case 'close-side': closeSide(); break;
    case 'close-drawer': closeDrawer(); break;
    case 'setf': S.f[d.k] = d.v; saveF(); render(); break;
    case 'more': S.showMore += 150; render(); break;
    case 'week': S.f.week = +d.d === 0 ? weekStart(today()) : addDays(S.f.week, +d.d); render(); break;
    case 'new-action': if (!S.canWrite) return; closeSide(); if (!$('#dwrap').hidden) closeDrawer(); openDrawer(fAction(null, { type: d.type, societe: d.societe, projet: d.projet, titre: d.titre, date: d.date })); if (d.contact) setTimeout(() => { const c = $('#f-contact'); if (c) c.value = d.contact; }, 0); break;
    case 'edit-action': { const a = S.actions.get(d.id); if (a) openDrawer(fAction({ id: d.id, ...a })); break; }
    case 'new-societe': if (S.canWrite) openDrawer(fSociete(null)); break;
    case 'edit-societe': { const s = S.societes.get(d.id); if (s) openDrawer(fSociete({ id: d.id, ...s })); break; }
    case 'new-contact': if (S.canWrite) openDrawer(fContact(null, { societe: d.societe })); break;
    case 'edit-contact': { const c = S.contacts.get(d.id); if (c) openDrawer(fContact({ id: d.id, ...c })); break; }
    case 'new-projet': if (S.canWrite) openDrawer(fProjet(null, { nature: d.nature, societe: d.societe })); break;
    case 'edit-projet': { const p = S.projets.get(d.id); if (p) openDrawer(fProjet({ id: d.id, ...p })); break; }
    case 'toggle-done': {
      const a = S.actions.get(d.id); if (!a || !S.canWrite) return;
      const done = a.statut !== 'fait';
      const upd = { ...a, statut: done ? 'fait' : 'a_faire', ...(done ? { faitLe: today(), prevuLe: a.date || '', date: today() } : { date: a.prevuLe || a.date }) };
      if (await save('actions', d.id, upd, false)) {
        if (done) toast('Action faite.', { label: 'Ajouter un compte rendu', fn: () => openDrawer(fAction({ id: d.id, ...upd })) }); else toast('Action remise à faire.');
      }
      break;
    }
    case 'set-etape': {
      const p = S.projets.get(d.id); if (!p || p.etape === d.v) return;
      const upd = { ...p, etape: d.v, proba: ETAPE[d.v].p, ...(['gagnee', 'perdue'].includes(d.v) ? { dateCloture: today() } : {}) };
      if (await save('projets', d.id, upd, false)) { if (d.v === 'perdue') openDrawer(fProjet({ id: d.id, ...upd })); toast(d.v === 'gagnee' ? 'Affaire gagnée. Pensez à saisir la commande dans Divalto.' : `Étape : ${ETAPE[d.v].l}.`); }
      break;
    }
    case 'set-statut': { const p = S.projets.get(d.id); if (p && p.statut !== d.v) await save('projets', d.id, { ...p, statut: d.v }, false); break; }
    case 'jalon': { const p = S.projets.get(d.id); if (!p) return; const j = (p.jalons || []).map((x, i) => i === +d.i ? { ...x, fait: !x.fait } : x); await save('projets', d.id, { ...p, jalons: j }, false); break; }
    case 'copy': { const v = d.v; try { await navigator.clipboard.writeText(v); toast('Copié.'); } catch (x) { toast(v); } break; }
    case 'del': {
      if (armed !== el) { armed = el; el.classList.add('armed'); el.textContent = 'Confirmer la suppression'; return; }
      const coll = { action: 'actions', societe: 'societes', contact: 'contacts', projet: 'projets' }[d.kind];
      if (d.kind === 'societe') for (const c of ix().ctBySoc.get(d.id) || []) await remove('contacts', c.id);
      if (await remove(coll, d.id)) { closeDrawer(); toast('Supprimé.'); if (d.kind === 'societe' && S.route === 'fiche') go('societes'); if (d.kind === 'projet' && S.route === 'projet') go('projets'); }
      armed = null; break;
    }
    case 'imp-reset': S.imp = null; render(); break;
    case 'imp-run': runImport(); break;
  }
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); submitForm(f); });
document.addEventListener('input', e => { const k = e.target.dataset?.f; if (k && e.target.tagName === 'INPUT') { S.f[k] = e.target.value; S.showMore = 0; scheduleRender(); } });
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset?.f;
  if (k && t.tagName === 'SELECT') { S.f[k] = k === 'dormant' ? +t.value : t.value; saveF(); render(); return; }
  if (t.id === 'impfile' && t.files[0]) readImport(t.files[0]);
  if (t.id === 'imp-sheet') setSheet(t.value);
  if (t.dataset?.imp) { S.imp.map[t.dataset.imp] = t.value === '' ? undefined : +t.value; render(); }
  if (t.id === 'imp-statut') S.imp.statut = t.value;
  if (t.id === 'imp-seg') S.imp.seg = t.value;
});
function afterRender() {
  const drop = $('#drop');
  if (drop) {
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) readImport(f); });
  }
  const kb = $('#kanban');
  if (kb && S.canWrite) {
    kb.addEventListener('dragstart', e => { const c = e.target.closest('[data-drag]'); if (!c) return; e.dataTransfer.setData('text/plain', c.dataset.drag); c.classList.add('dragging'); });
    kb.addEventListener('dragend', e => e.target.closest('[data-drag]')?.classList.remove('dragging'));
    kb.addEventListener('dragover', e => { const col = e.target.closest('[data-drop]'); if (!col) return; e.preventDefault(); $$('.kcol.over', kb).forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); });
    kb.addEventListener('dragleave', e => { const col = e.target.closest('[data-drop]'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
    kb.addEventListener('drop', async e => {
      const col = e.target.closest('[data-drop]'); if (!col) return; e.preventDefault(); col.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain'), p = S.projets.get(id), v = col.dataset.drop; if (!p || p.etape === v) return;
      const upd = { ...p, etape: v, proba: ETAPE[v].p, ...(['gagnee', 'perdue'].includes(v) ? { dateCloture: today() } : {}) };
      if (await save('projets', id, upd, false)) { if (v === 'perdue') openDrawer(fProjet({ id, ...upd })); toast(v === 'gagnee' ? 'Affaire gagnée. Pensez à saisir la commande dans Divalto.' : `${p.titre} : ${ETAPE[v].l}.`); }
    });
  }
}

/* ---------- Recherche globale ---------- */
const gs = $('#gsearch'), gr = $('#gres');
gs.addEventListener('input', () => {
  const q = norm(gs.value); if (q.length < 2) { gr.hidden = true; return; }
  const digits = gs.value.replace(/\D/g, '');
  const res = [];
  for (const s of all('societes')) if (norm([s.nom, s.codeTiers, s.ville, s.email].join(' ')).includes(q) || (digits.length > 4 && String(s.tel || '').replace(/\D/g, '').includes(digits))) res.push(['fiche-' + s.id, s.nom, 'Société' + (s.ville ? ' · ' + s.ville : '')]);
  for (const c of all('contacts')) if (norm([c.prenom, c.nom, c.email].join(' ')).includes(q) || (digits.length > 4 && String((c.tel || '') + (c.portable || '')).replace(/\D/g, '').includes(digits))) res.push([c.societeId ? 'fiche-' + c.societeId : 'contacts', ctName(c), 'Contact · ' + socName(c.societeId)]);
  for (const p of all('projets')) if (norm(p.titre).includes(q)) res.push(['projet-' + p.id, p.titre, NATURES[p.nature] + (p.societeId ? ' · ' + socName(p.societeId) : '')]);
  gr.innerHTML = res.length ? res.slice(0, 10).map(([to, a, b]) => `<a href="#${h(to)}"><b>${h(a)}</b><span class="small muted">${h(b)}</span></a>`).join('') : '<div class="pb muted">Aucun résultat</div>';
  gr.hidden = false;
});
gs.addEventListener('keydown', e => { if (e.key === 'Enter') { const a = $('a', gr); if (a) { location.hash = a.getAttribute('href'); gr.hidden = true; gs.value = ''; gs.blur(); } } if (e.key === 'Escape') { gr.hidden = true; gs.blur(); } });
gr.addEventListener('click', e => { if (e.target.closest('a')) { gr.hidden = true; gs.value = ''; } });

/* ---------- Toast ---------- */
let toastT = null;
function toast(msg, action) {
  const t = $('#toast'); t.innerHTML = ''; const s = document.createElement('span'); s.textContent = msg; t.appendChild(s);
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { t.hidden = true; action.fn(); }; t.appendChild(b); }
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, action ? 6000 : 3200);
}

const mq = matchMedia('(max-width: 860px)');
const syncMenuBtn = () => { $('#menu-btn').style.display = mq.matches ? '' : 'none'; };
mq.addEventListener ? mq.addEventListener('change', syncMenuBtn) : mq.addListener(syncMenuBtn); syncMenuBtn();
boot();
</script>
